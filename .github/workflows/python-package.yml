# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Pytest

on:
  # Only run when Python code, test data or dependencies change (not for
  # firmware or docs), on the default and active development branches.
  push:
    branches:
      - nick-22Library
      - PERI-DEVELOPMENT-TPB-1126
    paths:
      - "Receiver/**"
      - "Tests/**"
      - "dbc/**"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/python-package.yml"

  pull_request:
    paths:
      - "Receiver/**"
      - "Tests/**"
      - "dbc/**"
      - "pytest.ini"
      - ".coveragerc"
      - ".github/workflows/python-package.yml"

  workflow_dispatch:

# a newer push to the same branch or PR cancels the run in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Receiver/requirements.txt
          python -m pip install -r Tests/requirements-test.txt
      - name: Test with pytest
        run: |
          pytest --cov=Receiver --cov-report=term-missing --cov-fail-under=75
